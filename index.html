<body>
<main class="app">
  <img class="logo" src="logo.jpeg" alt="FA01 Betting Exchange" width="190" height="190">
  <div style="text-align:center;font-size:11px;font-weight:900;letter-spacing:3px" class="green">CANLI KUR</div>
  <h1>HESAPLAYICI</h1>

  <div class="rows">
    <div class="row"><div><div class="name coinname"><svg class="coinlogo" viewBox="0 0 32 32" aria-label="ABD Bayrağı"><defs><clipPath id="usdClip"><circle cx="16" cy="16" r="16"/></clipPath></defs><g clip-path="url(#usdClip)"><rect width="32" height="32" fill="#fff"/><rect y="0" width="32" height="2.46" fill="#B22234"/><rect y="4.92" width="32" height="2.46" fill="#B22234"/><rect y="9.85" width="32" height="2.46" fill="#B22234"/><rect y="14.77" width="32" height="2.46" fill="#B22234"/><rect y="19.69" width="32" height="2.46" fill="#B22234"/><rect y="24.62" width="32" height="2.46" fill="#B22234"/><rect y="29.54" width="32" height="2.46" fill="#B22234"/><rect x="0" y="0" width="14" height="17.2" fill="#3C3B6E"/></g></svg><span>USD</span></div><div class="sub">ABD Doları</div></div><div class="amt"><span class="sym" aria-hidden="true">$</span><input id="USD" value="100" inputmode="decimal"></div></div>
    <div class="row"><div><div class="name coinname"><svg class="coinlogo" viewBox="0 0 32 32" aria-label="AB Bayrağı"><defs><clipPath id="eurClip"><circle cx="16" cy="16" r="16"/></clipPath><polygon id="eurStar" points="0,-1.7 0.382,-0.526 1.617,-0.525 0.618,0.201 0.999,1.375 0,0.65 -0.999,1.375 -0.618,0.201 -1.617,-0.525 -0.382,-0.526" fill="#FFCC00"/></defs><g clip-path="url(#eurClip)"><rect width="32" height="32" fill="#003399"/><use href="#eurStar" x="16" y="5"/><use href="#eurStar" x="21.5" y="6.47"/><use href="#eurStar" x="25.53" y="10.5"/><use href="#eurStar" x="27" y="16"/><use href="#eurStar" x="25.53" y="21.5"/><use href="#eurStar" x="21.5" y="25.53"/><use href="#eurStar" x="16" y="27"/><use href="#eurStar" x="10.5" y="25.53"/><use href="#eurStar" x="6.47" y="21.5"/><use href="#eurStar" x="5" y="16"/><use href="#eurStar" x="6.47" y="10.5"/><use href="#eurStar" x="10.5" y="6.47"/></g></svg><span>EUR</span></div><div class="sub">Euro</div></div><div class="amt"><span class="sym" aria-hidden="true">€</span><input id="EUR" inputmode="decimal"></div></div>
    <div class="row"><div><div class="name">🇹🇷 TRY</div><div class="sub">Türk Lirası</div></div><div class="amt"><span class="sym" aria-hidden="true">₺</span><input id="TRY" inputmode="decimal"></div></div>
    <div class="row"><div><div class="name coinname"><svg class="coinlogo" viewBox="0 0 32 32" aria-label="Tether USDT"><circle cx="16" cy="16" r="16" fill="#26A17B"/><path fill="#fff" d="M18 17.4v-.1c-.1 0-.8.1-2 .1-1 0-1.7 0-2-.1v.1c-3.9-.2-6.8-.9-6.8-1.8s2.9-1.6 6.8-1.8v2.8c.3 0 1 .1 2 .1 1.2 0 1.9-.1 2-.1v-2.8c3.9.2 6.8.9 6.8 1.8s-2.9 1.6-6.8 1.8m0-3.9V11h5.5V7.2h-15V11H14v2.5c-4.5.2-7.9 1.1-7.9 2.2s3.4 2 7.9 2.2V25h4v-7.1c4.5-.2 7.9-1.1 7.9-2.2s-3.4-2-7.9-2.2"/></svg><span>USDT</span></div><div class="sub">Tether</div></div><input id="USDT" inputmode="decimal"></div>
    <div class="row"><div><div class="name coinname"><svg class="coinlogo" viewBox="0 0 32 32" aria-label="TRON TRX"><circle cx="16" cy="16" r="16" fill="#EF0027"/><path fill="#fff" d="M7.2 7.3l18 3.3-9.3 14.7L7.2 7.3zm3.1 2.6l5.7 11.5 5.8-9.4-11.5-2.1zm1.1 1.5l4.4 8.8.3-6.1-4.7-2.7zm5.6 2.5l-.3 6.5 4.8-7.7-4.5 1.2z"/></svg><span>TRX</span></div><div class="sub">TRON</div></div><input id="TRX" inputmode="decimal"></div>
  </div>

  <button id="refresh">KURLARI YENİLE</button>

  <div class="status">
    <span id="dot" class="dot"></span><span id="state">Veriler yükleniyor…</span>
